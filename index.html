<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>틱택토 문장 챌린지 - 멀티플레이어</title>
    <style>
        :root {
            --blue-color: #4A90E2;
            --red-color: #E24A4A;
            --bg-color: #f4f7f6;
        }
        body { 
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
            text-align: center; 
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 400px; 
            margin: 0 auto; 
            background: white;
            padding: 30px 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-height: 90vh;
            overflow-y: auto;
        }
        h1 { font-size: 24px; margin-bottom: 20px; color: #2c3e50; }
        
        input, select, textarea { 
            width: calc(100% - 24px); 
            padding: 12px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            font-size: 16px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            font-size: 14px;
            resize: vertical;
        }
        select {
            width: 100%;
            cursor: pointer;
        }
        .select-group { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
        }
        .select-group select { 
            flex: 1; 
        }
        button { 
            width: 100%;
            padding: 14px; 
            margin-top: 15px; 
            cursor: pointer; 
            background-color: #2c3e50; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px;
            font-weight: bold; 
            transition: background 0.2s;
        }
        button:hover { background-color: #1a252f; }
        .btn-blue { background-color: var(--blue-color); }
        .btn-blue:hover { background-color: #357ABD; }
        .btn-red { background-color: var(--red-color); }
        .btn-red:hover { background-color: #C0392B; }

        /* 게임 화면 관련 */
        #game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .player-badge { padding: 5px 10px; border-radius: 20px; color: white; font-size: 14px; font-weight: bold;}
        .badge-blue { background-color: var(--blue-color); }
        .badge-red { background-color: var(--red-color); }

        #room-code-display { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: #2c3e50; margin-bottom: 10px; }
        #turn-status { font-size: 18px; font-weight: bold; margin: 15px 0; padding: 10px; border-radius: 8px; transition: all 0.3s;}

        #board { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            margin-top: 20px; 
        }
        .cell { 
            aspect-ratio: 1 / 1; 
            border: none; 
            border-radius: 12px;
            background-color: #edf2f7; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 40px; 
            cursor: pointer; 
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.05);
            transition: transform 0.1s, background-color 0.3s;
        }
        .cell:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.05); }
        .cell.blue { background-color: var(--blue-color); color: white; }
        .cell.red { background-color: var(--red-color); color: white; }
        
        .instruction { font-size: 13px; color: #666; margin-top: 15px; background: #eef; padding: 10px; border-radius: 8px;}

        /* 커스텀 모달 (alert 대체) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* 화면 숨김 유틸 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container" id="loading-screen">
        <h2>서버에 연결 중입니다...</h2>
        <p>잠시만 기다려주세요.</p>
    </div>

    <!-- 1. 정보 입력 화면 -->
    <div class="container hidden" id="login-screen">
        <h1>틱택토 문장 챌린지</h1>
        <p>내 정보를 입력하고 입장하세요.</p>
        <div class="select-group">
            <select id="grade" required>
                <option value="">학년 선택</option>
            </select>
            <select id="classNum" required>
                <option value="">반 선택</option>
            </select>
        </div>
        <input type="number" id="studentNum" placeholder="번호" required>
        <input type="text" id="studentName" placeholder="이름" required>
        <button id="btn-login" class="btn-blue">다음 단계로</button>
        
        <!-- 교사 모드 진입부 -->
        <button id="btn-teacher-entry" style="margin-top:15px; background:none; color:#999; border:none; font-size:13px; cursor:pointer; padding:0; width:auto; text-decoration:underline;">👨‍🏫 교사 설정 모드</button>
        
        <div id="teacher-auth-panel" class="hidden" style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd;">
            <input type="password" id="teacher-pwd-input" placeholder="비밀번호 입력">
            <button id="btn-submit-teacher-pwd" class="btn-blue" style="padding: 10px; margin-top: 5px;">확인</button>
        </div>
    </div>

    <!-- 1-5. 교사 모드 화면 -->
    <div class="container hidden" id="teacher-screen">
        <h1>교사 설정 모드</h1>
        
        <!-- 기본 및 보안 설정 -->
        <div style="text-align: left; background: #f8f9fa; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #eee;">
            <h3 style="margin-top: 0; color: #2c3e50; font-size: 16px;">⚙️ 기본 및 보안 설정</h3>
            
            <label style="font-weight:bold; font-size:13px; color:#555;">교사 모드 비밀번호</label>
            <input type="text" id="t-password" placeholder="새 비밀번호 (입력 시 변경됨)">

            <label style="font-weight:bold; font-size:13px; color:#555; margin-top:10px; display:block;">최소 학년</label>
            <input type="number" id="t-min-grade" min="1" max="6">
            
            <label style="font-weight:bold; font-size:13px; color:#555; margin-top:10px; display:block;">최대 학년</label>
            <input type="number" id="t-max-grade" min="1" max="6">
            
            <label style="font-weight:bold; font-size:13px; color:#555; margin-top:10px; display:block;">최대 반</label>
            <input type="number" id="t-max-class" min="1" max="30">
            
            <button id="btn-save-settings" class="btn-blue" style="margin-top: 15px;">기본 설정 저장</button>
        </div>

        <!-- 단원 및 문장 관리 -->
        <div style="text-align: left; background: #eef2f5; padding: 15px; border-radius: 10px; border: 1px solid #dde3e8;">
            <h3 style="margin-top: 0; color: #2c3e50; font-size: 16px;">📚 단원 및 문장 관리</h3>
            <select id="t-unit-select">
                <option value="new">+ 새 단원 추가</option>
            </select>
            <input type="text" id="t-unit-name" placeholder="단원명 (예: 1단원. 인사하기)">
            <textarea id="t-unit-sentences" rows="6" placeholder="영어문장 : 한국어뜻 (엔터로 구분)&#10;예:&#10;What grade are you in? : 너는 몇 학년이니?&#10;Good morning : 좋은 아침"></textarea>
            
            <div style="display:flex; gap:10px; margin-top:5px;">
                <button id="btn-save-unit" class="btn-blue">단원 저장</button>
                <button id="btn-delete-unit" class="btn-red">단원 삭제</button>
            </div>
        </div>
        
        <button id="btn-close-teacher" style="margin-top:15px; background-color:#95a5a6;">닫기</button>
    </div>

    <!-- 2. 대기실 (방 생성/참여) 화면 -->
    <div class="container hidden" id="lobby-screen">
        <h1>멀티플레이 대기실</h1>
        <p id="lobby-greeting"></p>
        
        <div style="margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
            <h3>새로운 게임 만들기</h3>
            <p style="font-size: 13px; color: #666; margin-bottom:10px;">플레이할 단원을 선택하고 방을 만드세요. (선공)</p>
            <select id="create-room-unit" style="margin-bottom: 10px;">
                <option value="">단원 선택 (자유 문장)</option>
            </select>
            <button id="btn-create-room" class="btn-blue" style="margin-top:0;">방 만들기</button>
        </div>

        <div style="margin-top: 20px; padding: 20px; background: #f8f9fa; border-radius: 10px;">
            <h3>게임 참여하기</h3>
            <p style="font-size: 13px; color: #666;">친구의 방 코드를 입력하세요. (후공/빨간색)</p>
            <input type="text" id="join-room-code" placeholder="4자리 방 코드 입력" maxlength="4">
            <button id="btn-join-room" class="btn-red">입장하기</button>
        </div>
    </div>

    <!-- 3. 게임 화면 -->
    <div class="container hidden" id="game-screen">
        <div id="room-code-display">방 코드: <span id="current-room-id" style="color:var(--blue-color)">----</span></div>
        
        <div id="game-info">
            <div id="player1-info" class="player-badge badge-blue">대기 중...</div>
            <div style="font-weight: bold; color: #999;">VS</div>
            <div id="player2-info" class="player-badge badge-red" style="background-color: #ccc;">대기 중...</div>
        </div>

        <div id="turn-status">방에 입장했습니다.</div>
        
        <div class="instruction" style="margin-bottom: 5px;">
            <strong>게임 룰:</strong> 상대가 불러주는 뜻을 듣고 문장을 정확히 쓰거나 말하세요! 맞혔다면 원하는 칸을 클릭하세요.
        </div>
        
        <!-- 문장 리스트 보기 -->
        <button id="btn-toggle-sentences" style="margin-top:5px; background-color:#17a2b8; padding:10px; font-size:14px;">📖 이번 게임 문장 보기</button>
        <div id="sentence-list-container" class="hidden" style="margin-top:10px; padding:12px; background:#fff; border:1px solid #17a2b8; border-radius:8px; text-align:left; font-size:14px; max-height:200px; overflow-y:auto; line-height: 1.5;">
            <!-- 문장 목록이 여기에 표시됩니다 -->
        </div>

        <div id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
        
        <button id="btn-leave" style="margin-top:20px; background-color:#95a5a6;">나가기</button>
    </div>

    <!-- 알림 메시지 팝업 -->
    <div id="toast">메시지</div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 환경 변수 연동 (사용자 제공 설정 반영)
        const firebaseConfig = {
            apiKey: "AIzaSyDXp0gubAUnliOqznx37Xu4mrQ9NoHLhaA",
            authDomain: "tictac-c3d4f.firebaseapp.com",
            projectId: "tictac-c3d4f",
            storageBucket: "tictac-c3d4f.firebasestorage.app",
            messagingSenderId: "192437292015",
            appId: "1:192437292015:web:0cda453bc116146589841a",
            measurementId: "G-4LJJMW1MNB"
        };
        
        // 외부 실행 시 projectId를 기본 appId로 사용하도록 처리
        const appId = typeof __app_id !== 'undefined' ? __app_id : firebaseConfig.projectId;
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI 요소
        const screens = {
            loading: document.getElementById('loading-screen'),
            login: document.getElementById('login-screen'),
            teacher: document.getElementById('teacher-screen'),
            lobby: document.getElementById('lobby-screen'),
            game: document.getElementById('game-screen')
        };
        const cells = document.querySelectorAll('.cell');
        const toastEl = document.getElementById('toast');

        // 상태 변수
        let currentUser = null;
        let myUserInfo = {};
        let myColor = ""; // "blue" (방장/선공) or "red" (참여자/후공)
        let currentRoomId = "";
        let unsubscribeRoom = null;
        
        // 교사 데이터 관리 변수
        let globalSettings = { minGrade: 1, maxGrade: 6, maxClass: 10, teacherPassword: "1234" }; 
        let unitsData = [];

        // 알림(Toast) 함수 (alert 대신 사용)
        function showToast(message) {
            toastEl.innerText = message;
            toastEl.className = "show";
            setTimeout(() => { toastEl.className = toastEl.className.replace("show", ""); }, 3000);
        }

        // 화면 전환 함수
        function showScreen(screenName) {
            Object.values(screens).forEach(s => s.classList.add('hidden'));
            screens[screenName].classList.remove('hidden');
        }

        // 1. Firebase 인증 (앱 시작 시 필수)
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("인증 실패:", error);
                showToast("서버 인증에 실패했습니다.");
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                initSettingsListener();
                showScreen('login');
            }
        });

        initAuth();

        // 0. 교사 설정 및 단원 실시간 동기화
        function initSettingsListener() {
            // 기본 설정 연동
            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
            onSnapshot(settingsRef, (snap) => {
                if(snap.exists()) {
                    globalSettings = { ...globalSettings, ...snap.data() };
                }
                updateDropdowns();
            }, (error) => {
                console.error("설정 동기화 에러:", error);
            });

            // 단원 데이터 연동
            const unitsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'units');
            onSnapshot(unitsRef, (snap) => {
                if(snap.exists()) {
                    unitsData = snap.data().items || [];
                } else {
                    unitsData = [];
                }
                updateUnitDropdowns();
            }, (error) => {
                console.error("단원 동기화 에러:", error);
            });
        }

        function updateDropdowns() {
            const gradeSelect = document.getElementById('grade');
            const classSelect = document.getElementById('classNum');
            
            const currentGrade = gradeSelect.value;
            const currentClass = classSelect.value;

            gradeSelect.innerHTML = '<option value="">학년 선택</option>';
            for(let i = globalSettings.minGrade; i <= globalSettings.maxGrade; i++) {
                gradeSelect.innerHTML += `<option value="${i}">${i}학년</option>`;
            }

            classSelect.innerHTML = '<option value="">반 선택</option>';
            for(let i = 1; i <= globalSettings.maxClass; i++) {
                classSelect.innerHTML += `<option value="${i}">${i}반</option>`;
            }

            if (currentGrade && [...gradeSelect.options].some(o => o.value === currentGrade)) gradeSelect.value = currentGrade;
            if (currentClass && [...classSelect.options].some(o => o.value === currentClass)) classSelect.value = currentClass;
        }

        function updateUnitDropdowns() {
            const tSelect = document.getElementById('t-unit-select');
            const lSelect = document.getElementById('create-room-unit');
            
            const currentT = tSelect.value;
            const currentL = lSelect.value;

            tSelect.innerHTML = '<option value="new">+ 새 단원 추가</option>';
            lSelect.innerHTML = '<option value="">단원 선택 (자유 문장)</option>';

            unitsData.forEach(unit => {
                tSelect.innerHTML += `<option value="${unit.id}">${unit.name}</option>`;
                lSelect.innerHTML += `<option value="${unit.id}">${unit.name}</option>`;
            });

            if (currentT && [...tSelect.options].some(o => o.value === currentT)) tSelect.value = currentT;
            if (currentL && [...lSelect.options].some(o => o.value === currentL)) lSelect.value = currentL;
        }

        // 2. 로그인 폼 제출
        document.getElementById('btn-login').addEventListener('click', () => {
            const grade = document.getElementById('grade').value;
            const classNum = document.getElementById('classNum').value;
            const studentNum = document.getElementById('studentNum').value;
            const name = document.getElementById('studentName').value;

            if (!grade || !classNum || !studentNum || !name) {
                showToast("모든 정보를 입력해주세요!");
                return;
            }

            myUserInfo = { grade, classNum, studentNum, name };
            document.getElementById('lobby-greeting').innerText = `${grade}학년 ${classNum}반 ${name} 학생, 환영합니다!`;
            showScreen('lobby');
        });

        // 2-1. 교사 모드 진입 (비밀번호 확인 패널 열기)
        document.getElementById('btn-teacher-entry').addEventListener('click', () => {
            document.getElementById('teacher-auth-panel').classList.toggle('hidden');
            document.getElementById('teacher-pwd-input').focus();
        });

        // 2-2. 교사 모드 비밀번호 확인
        document.getElementById('btn-submit-teacher-pwd').addEventListener('click', () => {
            const pwd = document.getElementById('teacher-pwd-input').value;
            const correctPwd = globalSettings.teacherPassword || "1234";
            
            if(pwd === correctPwd) {
                // 교사 모드 진입 시 기존 설정 값 불러오기
                document.getElementById('t-min-grade').value = globalSettings.minGrade;
                document.getElementById('t-max-grade').value = globalSettings.maxGrade;
                document.getElementById('t-max-class').value = globalSettings.maxClass;
                document.getElementById('t-password').value = globalSettings.teacherPassword || "1234";
                
                // 패널 초기화 및 화면 전환
                document.getElementById('teacher-pwd-input').value = ""; 
                document.getElementById('teacher-auth-panel').classList.add('hidden');
                
                // 단원 초기화
                document.getElementById('t-unit-select').value = 'new';
                document.getElementById('t-unit-name').value = '';
                document.getElementById('t-unit-sentences').value = '';

                showScreen('teacher');
            } else {
                showToast("비밀번호가 틀렸습니다.");
            }
        });

        document.getElementById('btn-close-teacher').addEventListener('click', () => {
            showScreen('login');
        });

        // 2-3. 교사 모드: 기본 설정 저장
        document.getElementById('btn-save-settings').addEventListener('click', async () => {
            const minG = parseInt(document.getElementById('t-min-grade').value) || 1;
            const maxG = parseInt(document.getElementById('t-max-grade').value) || 6;
            const maxC = parseInt(document.getElementById('t-max-class').value) || 10;
            const newPwd = document.getElementById('t-password').value.trim();
            
            if (!newPwd) {
                showToast("비밀번호를 입력해주세요.");
                return;
            }

            const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
            try {
                await setDoc(settingsRef, {
                    minGrade: minG,
                    maxGrade: maxG,
                    maxClass: maxC,
                    teacherPassword: newPwd
                }, { merge: true });
                showToast("기본 설정이 저장되었습니다.");
            } catch(e) {
                console.error(e);
                showToast("설정 저장에 실패했습니다.");
            }
        });

        // 2-4. 교사 모드: 단원 선택 이벤트
        document.getElementById('t-unit-select').addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'new') {
                document.getElementById('t-unit-name').value = '';
                document.getElementById('t-unit-sentences').value = '';
            } else {
                const unit = unitsData.find(u => u.id === val);
                if (unit) {
                    document.getElementById('t-unit-name').value = unit.name;
                    document.getElementById('t-unit-sentences').value = unit.text;
                }
            }
        });

        // 2-5. 교사 모드: 단원 저장
        document.getElementById('btn-save-unit').addEventListener('click', async () => {
            const name = document.getElementById('t-unit-name').value.trim();
            const text = document.getElementById('t-unit-sentences').value.trim();
            const selectedId = document.getElementById('t-unit-select').value;
            
            if(!name || !text) {
                showToast("단원명과 문장을 모두 입력해주세요.");
                return;
            }

            let newItems = [...unitsData];
            if (selectedId === 'new') {
                newItems.push({ id: Date.now().toString(), name, text });
            } else {
                const idx = newItems.findIndex(u => u.id === selectedId);
                if (idx > -1) {
                    newItems[idx] = { ...newItems[idx], name, text };
                }
            }

            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'units'), { items: newItems });
                showToast("단원이 저장되었습니다.");
                document.getElementById('t-unit-select').value = 'new';
                document.getElementById('t-unit-name').value = '';
                document.getElementById('t-unit-sentences').value = '';
            } catch (e) {
                showToast("단원 저장에 실패했습니다.");
            }
        });

        // 2-6. 교사 모드: 단원 삭제
        document.getElementById('btn-delete-unit').addEventListener('click', async () => {
            const selectedId = document.getElementById('t-unit-select').value;
            if (selectedId === 'new') return;

            let newItems = unitsData.filter(u => u.id !== selectedId);
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'units'), { items: newItems });
                showToast("단원이 삭제되었습니다.");
                document.getElementById('t-unit-select').value = 'new';
                document.getElementById('t-unit-name').value = '';
                document.getElementById('t-unit-sentences').value = '';
            } catch (e) {
                showToast("단원 삭제에 실패했습니다.");
            }
        });

        // 3. 방 만들기 (Player 1 - Blue)
        document.getElementById('btn-create-room').addEventListener('click', async () => {
            if (!currentUser) return;
            
            const selectedUnitId = document.getElementById('create-room-unit').value;
            const selectedUnitName = selectedUnitId ? document.getElementById('create-room-unit').options[document.getElementById('create-room-unit').selectedIndex].text : "자유 문장";
            
            // 4자리 랜덤 숫자 코드 생성
            const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

            try {
                await setDoc(roomRef, {
                    player1: myUserInfo,
                    player2: null,
                    board: ["", "", "", "", "", "", "", "", ""],
                    turn: "blue",
                    status: "waiting",
                    winner: null,
                    unitId: selectedUnitId,
                    unitName: selectedUnitName
                });

                myColor = "blue";
                currentRoomId = roomCode;
                enterGameRoom(roomCode);
            } catch (error) {
                console.error("방 생성 오류:", error);
                showToast("방을 만들지 못했습니다.");
            }
        });

        // 4. 방 참여하기 (Player 2 - Red)
        document.getElementById('btn-join-room').addEventListener('click', async () => {
            if (!currentUser) return;

            const roomCode = document.getElementById('join-room-code').value.trim();
            if (roomCode.length !== 4) {
                showToast("4자리 코드를 입력해주세요.");
                return;
            }

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);
            
            try {
                const roomSnap = await getDoc(roomRef);
                if (roomSnap.exists()) {
                    const roomData = roomSnap.data();
                    if (roomData.status === "waiting" && !roomData.player2) {
                        // 참여 성공, 상태 업데이트
                        await updateDoc(roomRef, {
                            player2: myUserInfo,
                            status: "playing"
                        });
                        myColor = "red";
                        currentRoomId = roomCode;
                        enterGameRoom(roomCode);
                    } else {
                        showToast("이미 게임이 시작되었거나 꽉 찬 방입니다.");
                    }
                } else {
                    showToast("존재하지 않는 방 코드입니다.");
                }
            } catch (error) {
                console.error("방 참여 오류:", error);
                showToast("방 입장에 실패했습니다.");
            }
        });

        // 5. 게임방 화면 구성 및 실시간 리스너 연동
        function enterGameRoom(roomCode) {
            showScreen('game');
            document.getElementById('current-room-id').innerText = roomCode;
            document.getElementById('sentence-list-container').classList.add('hidden'); // 입장 시 문장창 닫기
            
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', roomCode);

            // 실시간 데이터 동기화
            unsubscribeRoom = onSnapshot(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    updateGameUI(snapshot.data());
                } else {
                    showToast("방이 삭제되었습니다.");
                    resetGame();
                }
            }, (error) => {
                console.error("동기화 에러:", error);
                showToast("네트워크 동기화 오류가 발생했습니다.");
            });
        }

        // 5-1. 게임 문장 보기 버튼 이벤트
        document.getElementById('btn-toggle-sentences').addEventListener('click', () => {
            const container = document.getElementById('sentence-list-container');
            container.classList.toggle('hidden');
        });

        // 6. UI 업데이트 로직 (Firestore 데이터를 바탕으로 화면 갱신)
        function updateGameUI(data) {
            // 플레이어 정보 표시
            document.getElementById('player1-info').innerText = data.player1 ? data.player1.name : "대기 중...";
            
            const p2Info = document.getElementById('player2-info');
            if (data.player2) {
                p2Info.innerText = data.player2.name;
                p2Info.style.backgroundColor = "var(--red-color)";
            } else {
                p2Info.innerText = "대기 중...";
                p2Info.style.backgroundColor = "#ccc";
            }

            // 이번 게임 문장 렌더링
            const sentenceContainer = document.getElementById('sentence-list-container');
            if (data.unitId) {
                const unit = unitsData.find(u => u.id === data.unitId);
                if (unit) {
                    const html = unit.text.split('\n').filter(l => l.trim()).map(l => {
                        const parts = l.split(':');
                        if(parts.length >= 2) {
                            return `<div style="margin-bottom:6px; border-bottom: 1px dashed #eee; padding-bottom: 4px;"><b>${parts[0].trim()}</b> : <span style="color:#666;">${parts.slice(1).join(':').trim()}</span></div>`;
                        }
                        return `<div style="margin-bottom:6px; border-bottom: 1px dashed #eee; padding-bottom: 4px;">${l.trim()}</div>`;
                    }).join('');
                    sentenceContainer.innerHTML = html || "입력된 문장이 없습니다.";
                } else {
                    sentenceContainer.innerHTML = "해당 단원 정보를 찾을 수 없습니다.";
                }
            } else {
                sentenceContainer.innerHTML = "선택된 단원이 없습니다. 자유롭게 문장을 만들어 질문하세요!";
            }

            // 보드판 렌더링
            data.board.forEach((val, index) => {
                const cell = cells[index];
                cell.className = "cell"; // 초기화
                cell.innerText = "";
                if (val === "blue") {
                    cell.classList.add("blue");
                    cell.innerText = "O";
                } else if (val === "red") {
                    cell.classList.add("red");
                    cell.innerText = "X";
                }
            });

            // 상태 메시지 렌더링
            const statusEl = document.getElementById('turn-status');
            if (data.status === "waiting") {
                statusEl.innerText = "상대방을 기다리는 중입니다...";
                statusEl.style.backgroundColor = "#fff3cd";
                statusEl.style.color = "#856404";
            } else if (data.status === "finished") {
                if (data.winner === "draw") {
                    statusEl.innerText = "무승부! 게임이 종료되었습니다.";
                    statusEl.style.backgroundColor = "#e2e3e5";
                    statusEl.style.color = "#383d41";
                } else {
                    const winnerName = data.winner === "blue" ? data.player1.name : data.player2.name;
                    statusEl.innerText = `🎉 ${winnerName} 승리! 🎉`;
                    statusEl.style.backgroundColor = data.winner === "blue" ? "#d4edda" : "#f8d7da";
                    statusEl.style.color = data.winner === "blue" ? "#155724" : "#721c24";
                }
            } else if (data.status === "playing") {
                if (data.turn === myColor) {
                    statusEl.innerText = "내 차례입니다! 문장을 맞히고 칸을 고르세요.";
                    statusEl.style.backgroundColor = myColor === "blue" ? "#d4edda" : "#f8d7da";
                    statusEl.style.color = myColor === "blue" ? "#155724" : "#721c24";
                } else {
                    const oppName = myColor === "blue" ? data.player2.name : data.player1.name;
                    statusEl.innerText = `상대방(${oppName})의 차례입니다...`;
                    statusEl.style.backgroundColor = "#e2e3e5";
                    statusEl.style.color = "#383d41";
                }
            }
            
            // 로컬 변수에 데이터 캐싱 (클릭 이벤트에서 사용)
            window.currentGameData = data;
        }

        // 7. 칸 클릭 이벤트 (보드 업데이트)
        cells.forEach(cell => {
            cell.addEventListener('click', async (e) => {
                if (!currentUser || !currentRoomId || !window.currentGameData) return;
                
                const data = window.currentGameData;
                const index = e.target.getAttribute('data-index');

                // 방어 로직: 게임 중이 아님, 내 차례 아님, 이미 칠해진 칸임
                if (data.status !== "playing") return;
                if (data.turn !== myColor) {
                    showToast("내 차례가 아닙니다!");
                    return;
                }
                if (data.board[index] !== "") {
                    showToast("이미 선택된 칸입니다.");
                    return;
                }

                // 보드 업데이트 로직
                const newBoard = [...data.board];
                newBoard[index] = myColor;

                // 승리 체크
                const winner = checkWin(newBoard);
                const nextTurn = myColor === "blue" ? "red" : "blue";
                
                let newStatus = "playing";
                if (winner) newStatus = "finished";

                // Firestore에 결과 반영
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomId);
                try {
                    await updateDoc(roomRef, {
                        board: newBoard,
                        turn: nextTurn,
                        winner: winner,
                        status: newStatus
                    });
                } catch(error) {
                    console.error("보드 갱신 에러:", error);
                    showToast("서버에 반영하지 못했습니다.");
                }
            });
        });

        // 승리 판정 함수
        function checkWin(board) {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8], // 가로
                [0, 3, 6], [1, 4, 7], [2, 5, 8], // 세로
                [0, 4, 8], [2, 4, 6]             // 대각선
            ];
            for (let i = 0; i < lines.length; i++) {
                const [a, b, c] = lines[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return board[a]; // "blue" 또는 "red" 반환
                }
            }
            if (!board.includes("")) return "draw"; // 꽉 찼으면 무승부
            return null; // 아직 진행 중
        }

        // 방 나가기 로직
        document.getElementById('btn-leave').addEventListener('click', () => {
            resetGame();
        });

        function resetGame() {
            if (unsubscribeRoom) {
                unsubscribeRoom();
                unsubscribeRoom = null;
            }
            currentRoomId = "";
            myColor = "";
            window.currentGameData = null;
            showScreen('lobby');
        }
    </script>
</body>
</html>
